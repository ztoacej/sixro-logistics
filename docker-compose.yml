      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=inventory_schema,public
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: inventory_schema
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=inventory_schema,public
      INVENTORY_DB_USERNAME: inventory_user
      INVENTORY_DB_PASSWORD: ${APP_DB_PASSWORD}
