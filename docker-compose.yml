      retries: 20
      start_period: 90s

  product-service:
    <<: *app
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: product-service }
    environment:
      <<: *app-environment
      SERVER_PORT: "19095"
      EUREKA_INSTANCE_IP_ADDRESS: product-service
