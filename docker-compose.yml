      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: product_schema
      DB_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=product_schema,public
      DB_USERNAME: product_user
      DB_PASSWORD: ${APP_DB_PASSWORD}
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=product_schema,public
      PRODUCT_DB_USERNAME: product_user
      PRODUCT_DB_PASSWORD: ${APP_DB_PASSWORD}
    expose: ["19095"]
    depends_on:
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19095/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  order-service:
    <<: *app
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: order-service }
    environment:
      <<: *app-environment
      SERVER_PORT: "19096"
      EUREKA_INSTANCE_IP_ADDRESS: order-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=order_schema,public
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: order_schema
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=order_schema,public
      ORDER_DB_USERNAME: order_user
      ORDER_DB_PASSWORD: ${APP_DB_PASSWORD}
    expose: ["19096"]
    depends_on:
