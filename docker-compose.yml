      retries: 20
      start_period: 90s

  delivery-service:
    <<: *app
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: delivery-service }
    environment:
      <<: *app-environment
      SERVER_PORT: "19097"
      EUREKA_INSTANCE_IP_ADDRESS: delivery-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=delivery_schema,public
      SPRING_DATASOURCE_USERNAME: delivery_user
