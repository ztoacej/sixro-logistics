    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: notification-service }
    environment:
      <<: *app-environment
      SERVER_PORT: "19099"
      EUREKA_INSTANCE_IP_ADDRESS: notification-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=notification_schema,public
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: notification_schema
      NOTI_DB_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=notification_schema,public
      NOTI_DB_USERNAME: notification_user
      NOTI_DB_PASSWORD: ${APP_DB_PASSWORD}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-local-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-local-disabled}
    expose: ["19099"]
    depends_on:
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
