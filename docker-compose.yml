      SPRING_DATASOURCE_USERNAME: company_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: company_schema
      COMPANY_DB_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=company_schema,public
      COMPANY_DB_USERNAME: company_user
      COMPANY_DB_PASSWORD: ${APP_DB_PASSWORD}
    expose: ["19094"]
