      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: delivery_schema
      DELIVERY_DB_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=delivery_schema,public
      DELIVERY_DB_USERNAME: delivery_user
