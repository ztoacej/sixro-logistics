  hub-service:
    <<: *app
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: hub-service }
    environment:
      <<: *app-environment
      SERVER_PORT: "19098"
      EUREKA_INSTANCE_IP_ADDRESS: hub-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=hub_schema,public
      SPRING_DATASOURCE_USERNAME: hub_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: hub_schema
      DB_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=hub_schema,public
      DB_USERNAME: hub_user
      DB_PASSWORD: ${APP_DB_PASSWORD}
      HUB_DB_URL: jdbc:postgresql://postgres:5432/sixro_db?currentSchema=hub_schema,public
      HUB_DB_USERNAME: hub_user
      HUB_DB_PASSWORD: ${APP_DB_PASSWORD}
      TMAP_APP_KEY: ${TMAP_APP_KEY:-local-disabled}
    expose: ["19098"]
    depends_on:
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
